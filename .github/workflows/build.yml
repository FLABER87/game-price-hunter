# Builds and tests every push and pull request, squash-merges pull requests from this repository's
# branches once they pass, and turns a pushed vX.Y.Z tag into a draft release with the exe, the
# installer and the installer's signature for the in-app updater.
# "Build and test" is the check main requires before merging.
name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    # ready_for_review: a draft marked ready is built again and then merged.
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build all projects
        run: dotnet build GamePriceHunter.slnx --nologo

      # A fixed Inno Setup 7 release, checked against its SHA-256 and installed into a folder of its own; the
      # installer is built with its ISCC.exe rather than any Inno Setup the runner image has.
      - name: Install Inno Setup
        env:
          INNO_URL: https://github.com/jrsoftware/issrc/releases/download/is-7_1_0/innosetup-7.1.0-x64.exe
          INNO_SHA256: 0362a383ed217d4c4239b5933866dd96d3eb2102737da92f80f6057a4b40df2f
        run: |
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          $dir = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          Invoke-WebRequest $env:INNO_URL -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ne $env:INNO_SHA256) { throw 'The Inno Setup download does not match its SHA-256.' }
          $process = Start-Process $setup -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/CURRENTUSER', "/DIR=`"$dir`"" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installing Inno Setup failed with exit code $($process.ExitCode)." }
          "ISCC=$(Join-Path $dir 'ISCC.exe')" >> $env:GITHUB_ENV

      # Tests, the single-file exe and the installer. Tag builds
      # also sign the installer with the UPDATE_SIGNING_KEY secret; the app won't install it without that.
      - name: Test and publish
        env:
          UPDATE_SIGNING_KEY: ${{ github.ref_type == 'tag' && secrets.UPDATE_SIGNING_KEY || '' }}
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '' }
          ./build/publish.ps1 -Version $version -InnoSetupCompiler $env:ISCC
          if (-not (Test-Path artifacts/installer/GamePriceHunter-Setup.exe)) { throw 'The installer was not built.' }
          if ($version -and -not (Test-Path artifacts/installer/GamePriceHunter-Setup.exe.sig)) {
            throw 'The installer was not signed: the UPDATE_SIGNING_KEY secret is missing (see build/new-signing-key.ps1).'
          }

      - uses: actions/upload-artifact@v7
        with:
          name: GamePriceHunter
          path: |
            artifacts/publish/win-x64/GamePriceHunter.exe
            artifacts/installer/GamePriceHunter-Setup.exe
            artifacts/installer/GamePriceHunter-Setup.exe.sig
          if-no-files-found: error
          retention-days: 14

  # Merges here rather than through GitHub's auto-merge: pull requests auto-merged with the workflow
  # token kept their branches, the repository's "delete head branches" setting notwithstanding. Drafts
  # and pull requests from forks are left alone. The head commit must still be the one that was tested.
  merge:
    name: Merge
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Squash-merge and delete the branch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # --repo: no checkout here, so gh deletes only the branch on GitHub.
        run: gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --delete-branch --match-head-commit "$HEAD_SHA"

  release:
    name: Draft release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      # checkout leaves a lightweight copy of the tag; fetch the real one to read its message.
      - name: Fetch the tag
        run: git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"

      - uses: actions/download-artifact@v8
        with:
          name: GamePriceHunter
          path: dist

      # The message of an annotated tag becomes the release notes; publish the draft on GitHub after a look.
      # A re-run refreshes the files of a draft only: published files are final, a fix ships as a new version.
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          files=(dist/installer/GamePriceHunter-Setup.exe dist/installer/GamePriceHunter-Setup.exe.sig dist/publish/win-x64/GamePriceHunter.exe)
          if is_draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> view-error.txt); then
            if [ "$is_draft" != true ]; then
              echo "::error::Release $TAG is already published; its files are not replaced. Release the change as a new version."
              exit 1
            fi
            gh release upload "$TAG" "${files[@]}" --clobber
          elif ! grep -q 'release not found' view-error.txt; then
            cat view-error.txt >&2
            exit 1
          else
            if [ "$(git cat-file -t "$TAG")" = tag ]; then
              git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$TAG" > notes.md
            else
              : > notes.md
            fi
            gh release create "$TAG" "${files[@]}" --draft --verify-tag --title "Game Price Hunter ${TAG#v}" --notes-file notes.md
          fi
