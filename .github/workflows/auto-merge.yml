# Turns on auto-merge for pull requests from this repository's own branches: they are squash-merged
# as soon as the required "Build and test" check passes, and the branch is deleted after the merge.
# Open a pull request as a draft to hold it back; marking it ready for review turns auto-merge on.
name: Auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    name: Enable auto-merge
    if: github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
